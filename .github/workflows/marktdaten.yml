name: Marktdaten abrufen

on:
  schedule:
    # Mo-Fr 21:15 UTC = 22:15 Uhr deutscher Winterzeit, nach US-Börsenschluss.
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marktdaten
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten von Alpha Vantage holen
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Änderungen speichern
        if: always()
        run: |
          git config user.name "marktdaten-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Marktdaten $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
